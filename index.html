<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер магазина</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="themeColor" content="#0F0F10">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Макет: липкая шапка с вкладками, под ней одна рабочая область; сводка сверху, таблица ниже. */
/* ===== ТЕМЫ: все цвета меняются одним блоком переменных. Набор тем перенесён из демо карточки товара ===== */
:root{--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body[data-theme="sd"]{--bg:#0F0F10;--ink:#F2F2F3;--mute:#9A9AA1;--accent:#F2F2F3;--accent-ink:#0F0F10;--panel:#1B1B1D;--line:rgba(255,255,255,.1);--chip:rgba(255,255,255,.2);--r1:#FFFFFF;--r2:#B9BDC6;--r3:#7E838D;--rw:#FFFFFF;--soft:rgba(255,255,255,.07);--good:#55c988;--warn:#e3a94a;--bad:#f0776c;--info:#7ba6f0;--good-bg:rgba(85,201,136,.16);--warn-bg:rgba(227,169,74,.16);--bad-bg:rgba(240,119,108,.16);--info-bg:rgba(123,166,240,.16);--shadow:0 16px 40px rgba(0,0,0,.55);--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--gh:rgba(255,255,255,.5);--gs:rgba(0,0,0,.5);color-scheme:dark;}
body[data-theme="sl"]{--bg:#F4F4F5;--ink:#111113;--mute:#6B6B73;--accent:#111113;--accent-ink:#FFFFFF;--panel:#FFFFFF;--line:rgba(17,17,19,.1);--chip:rgba(17,17,19,.2);--r1:#8D929C;--r2:#C3C7CF;--r3:#5F646E;--rw:#FFFFFF;--soft:rgba(17,17,19,.06);--good:#1a8449;--warn:#a86400;--bad:#c0392f;--info:#2c5fb3;--good-bg:rgba(26,132,73,.12);--warn-bg:rgba(168,100,0,.12);--bad-bg:rgba(192,57,47,.12);--info-bg:rgba(44,95,179,.12);--shadow:0 16px 40px rgba(20,24,40,.2);--g1:rgba(255,255,255,.8);--g2:rgba(255,255,255,.42);--gh:rgba(255,255,255,1);--gs:rgba(20,24,40,.24);color-scheme:light;}
body[data-theme="chrome"]{--bg:#060607;--ink:#F2F4F7;--mute:#9A9EA8;--accent:#F2F4F7;--accent-ink:#060607;--panel:#1A1B1F;--line:rgba(255,255,255,.14);--chip:rgba(255,255,255,.24);--r1:#8FE3FF;--r2:#B6A3FF;--r3:#FFA8E0;--rw:#FFFFFF;--soft:rgba(255,255,255,.07);--good:#55c988;--warn:#e3a94a;--bad:#f0776c;--info:#7ba6f0;--good-bg:rgba(85,201,136,.16);--warn-bg:rgba(227,169,74,.16);--bad-bg:rgba(240,119,108,.16);--info-bg:rgba(123,166,240,.16);--shadow:0 16px 40px rgba(0,0,0,.55);--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--gh:rgba(255,255,255,.5);--gs:rgba(0,0,0,.5);color-scheme:dark;--a1g:linear-gradient(135deg,#FFFFFF 0%,#C4CFDE 38%,#FFFFFF 55%,#A9B4C4 100%);}
body[data-theme="tape"]{--bg:#8A2A1B;--ink:#F2E2BE;--mute:#DDB99C;--accent:#DDAA3C;--accent-ink:#2A0A04;--panel:#3A110B;--line:rgba(242,226,190,.18);--chip:rgba(242,226,190,.32);--r1:#FFD98A;--r2:#DDAA3C;--r3:#FF9C70;--rw:#FFF1CF;--soft:rgba(255,255,255,.07);--good:#55c988;--warn:#e3a94a;--bad:#f0776c;--info:#7ba6f0;--good-bg:rgba(85,201,136,.16);--warn-bg:rgba(227,169,74,.16);--bad-bg:rgba(240,119,108,.16);--info-bg:rgba(123,166,240,.16);--shadow:0 16px 40px rgba(0,0,0,.55);--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--gh:rgba(255,255,255,.5);--gs:rgba(0,0,0,.5);color-scheme:dark;--good:#BFE8A8;--bad:#FFD0C2;--info:#BFD8FF;--warn:#FFD98A;background-image:linear-gradient(180deg,#872818 0%,#96412A 100%);background-attachment:fixed;}
body[data-theme="ice"]{--bg:#E8EEF5;--ink:#0E1420;--mute:#5E6A7C;--accent:#0E1420;--accent-ink:#FFFFFF;--panel:#FFFFFF;--line:rgba(14,20,32,.12);--chip:rgba(14,20,32,.26);--r1:#4FB3F0;--r2:#7E8CF5;--r3:#B79BF7;--rw:#FFFFFF;--soft:rgba(17,17,19,.06);--good:#1a8449;--warn:#a86400;--bad:#c0392f;--info:#2c5fb3;--good-bg:rgba(26,132,73,.12);--warn-bg:rgba(168,100,0,.12);--bad-bg:rgba(192,57,47,.12);--info-bg:rgba(44,95,179,.12);--shadow:0 16px 40px rgba(20,24,40,.2);--g1:rgba(255,255,255,.8);--g2:rgba(255,255,255,.42);--gh:rgba(255,255,255,1);--gs:rgba(20,24,40,.24);color-scheme:light;}
body[data-theme="mono"]{--bg:#15144B;--ink:#F0EADD;--mute:#A9A8C8;--accent:#F0EADD;--accent-ink:#15144B;--panel:#1F1E60;--line:rgba(240,234,221,.16);--chip:rgba(240,234,221,.3);--r1:#F0EADD;--r2:#9C9BFF;--r3:#6E6DE8;--rw:#FBF6EA;--soft:rgba(255,255,255,.07);--good:#55c988;--warn:#e3a94a;--bad:#f0776c;--info:#7ba6f0;--good-bg:rgba(85,201,136,.16);--warn-bg:rgba(227,169,74,.16);--bad-bg:rgba(240,119,108,.16);--info-bg:rgba(123,166,240,.16);--shadow:0 16px 40px rgba(0,0,0,.55);--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--gh:rgba(255,255,255,.5);--gs:rgba(0,0,0,.5);color-scheme:dark;}
body[data-theme="fresco"]{--bg:#1A1410;--ink:#EFE4D0;--mute:#A99B86;--accent:#D2A05A;--accent-ink:#1A1410;--panel:#2A211A;--line:rgba(239,228,208,.14);--chip:rgba(239,228,208,.26);--r1:#E8C68A;--r2:#D2A05A;--r3:#86AEDB;--rw:#F7ECD8;--soft:rgba(255,255,255,.07);--good:#55c988;--warn:#e3a94a;--bad:#f0776c;--info:#7ba6f0;--good-bg:rgba(85,201,136,.16);--warn-bg:rgba(227,169,74,.16);--bad-bg:rgba(240,119,108,.16);--info-bg:rgba(123,166,240,.16);--shadow:0 16px 40px rgba(0,0,0,.55);--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--gh:rgba(255,255,255,.5);--gs:rgba(0,0,0,.5);color-scheme:dark;}
body[data-theme="t1"]{--bg:#0E0E10;--ink:#EDE6DA;--mute:#A8A297;--accent:#FF4D00;--accent-ink:#0E0E10;--panel:#202024;--line:rgba(255,255,255,.13);--chip:rgba(255,255,255,.22);--r1:#FF7A3D;--r2:#FFB48A;--r3:#5C78FF;--rw:#FFFFFF;--soft:rgba(255,255,255,.07);--good:#55c988;--warn:#e3a94a;--bad:#f0776c;--info:#7ba6f0;--good-bg:rgba(85,201,136,.16);--warn-bg:rgba(227,169,74,.16);--bad-bg:rgba(240,119,108,.16);--info-bg:rgba(123,166,240,.16);--shadow:0 16px 40px rgba(0,0,0,.55);--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--gh:rgba(255,255,255,.5);--gs:rgba(0,0,0,.5);color-scheme:dark;}
body[data-theme="t4"]{--bg:#F3EFE6;--ink:#0E0E10;--mute:#6B665C;--accent:#FF4D00;--accent-ink:#0E0E10;--panel:#FFFFFF;--line:rgba(14,14,16,.12);--chip:rgba(14,14,16,.28);--r1:#FF4D00;--r2:#1F3BFF;--r3:#FF9A5C;--rw:#FFFFFF;--soft:rgba(17,17,19,.06);--good:#1a8449;--warn:#a86400;--bad:#c0392f;--info:#2c5fb3;--good-bg:rgba(26,132,73,.12);--warn-bg:rgba(168,100,0,.12);--bad-bg:rgba(192,57,47,.12);--info-bg:rgba(44,95,179,.12);--shadow:0 16px 40px rgba(20,24,40,.2);--g1:rgba(255,255,255,.8);--g2:rgba(255,255,255,.42);--gh:rgba(255,255,255,1);--gs:rgba(20,24,40,.24);color-scheme:light;}
body[data-theme="t2"]{--bg:#0E0E10;--ink:#F3EFE6;--mute:#A8A297;--accent:#E8FF2B;--accent-ink:#0E0E10;--panel:#202024;--line:rgba(255,255,255,.13);--chip:rgba(255,255,255,.22);--r1:#E8FF2B;--r2:#FF5CA5;--r3:#F6FFB0;--rw:#FFFFFF;--soft:rgba(255,255,255,.07);--good:#55c988;--warn:#e3a94a;--bad:#f0776c;--info:#7ba6f0;--good-bg:rgba(85,201,136,.16);--warn-bg:rgba(227,169,74,.16);--bad-bg:rgba(240,119,108,.16);--info-bg:rgba(123,166,240,.16);--shadow:0 16px 40px rgba(0,0,0,.55);--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--gh:rgba(255,255,255,.5);--gs:rgba(0,0,0,.5);color-scheme:dark;}
body[data-theme="t10"]{--bg:#E9E9EC;--ink:#111114;--mute:#66666E;--accent:#6C3BFF;--accent-ink:#FFFFFF;--panel:#FFFFFF;--line:rgba(17,17,20,.12);--chip:rgba(17,17,20,.28);--r1:#6C3BFF;--r2:#9BD600;--r3:#A98BFF;--rw:#FFFFFF;--soft:rgba(17,17,19,.06);--good:#1a8449;--warn:#a86400;--bad:#c0392f;--info:#2c5fb3;--good-bg:rgba(26,132,73,.12);--warn-bg:rgba(168,100,0,.12);--bad-bg:rgba(192,57,47,.12);--info-bg:rgba(44,95,179,.12);--shadow:0 16px 40px rgba(20,24,40,.2);--g1:rgba(255,255,255,.8);--g2:rgba(255,255,255,.42);--gh:rgba(255,255,255,1);--gs:rgba(20,24,40,.24);color-scheme:light;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:500}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.top-right{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn b{font-variant-numeric:tabular-nums}

.banner{max-width:1280px;margin:12px auto 0;padding:0 16px}
.banner div{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:500}
main{max-width:1280px;margin:0 auto;padding:16px 16px 64px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-height:38px;max-width:100%}
textarea.in{width:100%;min-height:84px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;min-height:38px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--mute);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{color:var(--mute);font-size:13px}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px;overflow-wrap:anywhere}
.tile .s{color:var(--mute);font-size:12px;margin-top:2px}
.tile.key{border-color:var(--accent);background:var(--soft)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
td .sub{color:var(--mute);font-size:12px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;background:var(--soft)}
.thumb.empty{border:1px dashed var(--line)}
.empty-state{padding:36px 16px;text-align:center;color:var(--mute)}

.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--soft);color:var(--mute)}
select.status{border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:var(--panel);font-size:13px;font-weight:600}
select.status.s-transit{color:var(--info)} select.status.s-stock{color:var(--good)} select.status.s-reserved{color:var(--warn)}

/* Доска задач */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--soft);border-radius:12px;padding:10px;min-height:160px}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:2px 4px 8px;display:flex;justify-content:space-between}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.tcard:hover{border-color:var(--accent)}
.tcard .t{font-weight:600;overflow-wrap:anywhere}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--mute)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent)}
.mine{list-style:none;margin:0;padding:0}
.mine li{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mine li:last-child{border-bottom:0}
.mine input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.mine .t{flex:1;min-width:0;cursor:pointer;font-weight:500;overflow-wrap:anywhere}
.mine li.done .t{text-decoration:line-through;color:var(--mute)}

/* Идеи */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.idea{padding:14px;display:flex;flex-direction:column;gap:10px}
.idea h3{font-size:16px;overflow-wrap:anywhere}
.idea p{margin:0;color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}
.idea .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}
.vote{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;cursor:pointer;font-variant-numeric:tabular-nums}
.vote.on.up{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.vote.on.down{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

/* Окно */
.ov{position:fixed;inset:0;background:rgba(10,16,14,.5);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:20}
.ov.open{display:flex}
.box{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:18px}
.box h2{font-size:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);min-width:0}
label.f .in{color:var(--ink);font-size:15px;width:100%}
.box .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:flex-end}
.box .row .left{margin-right:auto}
.thread{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.thread h3{font-size:14px;margin-bottom:8px}
.msg{padding:8px 0;border-bottom:1px solid var(--line)}
.msg .who{font-weight:600;font-size:13px}
.msg .when{color:var(--mute);font-size:12px;margin-left:6px}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.send{display:flex;gap:8px;margin-top:10px}
.send .in{flex:1;min-width:0}
.who-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);display:none}
.toast.show{display:block}
.login{max-width:380px;margin:8vh auto 0;padding:22px}
.login h2{font-size:20px;margin-bottom:14px}
.login .f{margin-bottom:10px}
a.lnk{color:var(--accent);font-size:12px;white-space:nowrap}
@media (max-width:720px){
  .board{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .tile .v{font-size:20px}
}

/* ===== Оформление из демо: «таблетки», стеклянные кнопки с переливом, фон-звезда ===== */
body{font-size:14px}
.top{background:var(--bg)} main,.banner{position:relative;z-index:1}
.star{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.star svg{position:absolute;left:0;top:0}
.star path{fill:var(--ink);opacity:.09}
.card,.tile{border-radius:19px;border-color:var(--line)}
.box{border-radius:22px;background:var(--bg);border:1px solid var(--line)}
.in,select.in,textarea.in{border-radius:12px;border-color:var(--chip)}
select.status{border-color:var(--chip)}
.toast{border-radius:999px;font-weight:500}
.tab{border-radius:999px} .seg{border-radius:999px;border-color:var(--chip)} .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.col{border-radius:19px} .tcard{border-radius:14px}
.btn,.chipbtn,.vote{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:999px;font-weight:500;
  background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 var(--gh),inset 0 -12px 14px -12px var(--gh),0 12px 26px -12px var(--gs)}
.btn.pri{background:var(--a1g,var(--accent));color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 12px 14px -9px rgba(255,255,255,.5),inset 0 -12px 14px -9px rgba(0,0,0,.2),0 12px 24px -10px var(--accent)}
/* кромка в один пиксель цветами темы */
.btn::before,.chipbtn::before,.vote::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.9;
  background:conic-gradient(from var(--ga,200deg),var(--rw),var(--r1) 9%,rgba(255,255,255,.07) 22%,rgba(255,255,255,.07) 40%,var(--r2) 48%,var(--rw) 55%,var(--r3) 63%,rgba(255,255,255,.07) 78%,rgba(255,255,255,.07) 92%,var(--rw));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
/* полоса света под текстом; пробегает один раз при наведении */

}

<script type="module">
/* ============ Настройки Firebase ============
   Это адрес твоего проекта, не секрет. Данные защищают правила доступа в консоли Firebase. */
const firebaseConfig = {
  apiKey: "AIzaSyAafqRmio9tGxkqUTEr8tGSWS26qymjd2c",
  authDomain: "kantry-71b99.firebaseapp.com",
  projectId: "kantry-71b99",
  storageBucket: "kantry-71b99.firebasestorage.app",
  messagingSenderId: "791956451222",
  appId: "1:791956451222:web:7c413671aaaba0c7f9f7b7"
};
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, collection, setDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const fbApp = initializeApp(firebaseConfig), auth = getAuth(fbApp), fs = getFirestore(fbApp);
// Тонкая обёртка над Firestore: остальной код работает с базой через неё
const wrapDoc = ref => ({
  id: ref.id,
  set: d => setDoc(ref, d),
  update: d => setDoc(ref, d, {merge:true}),   // merge: меняются только переданные поля
  delete: () => deleteDoc(ref),
  onSnapshot: (next, err) => onSnapshot(ref, s => next({exists:s.exists(), data:() => s.data(), metadata:s.metadata}), err)
});
const db = {
  doc: p => wrapDoc(doc(fs, p)),
  collection: c => ({ doc: id => wrapDoc(id ? doc(fs, c, id) : doc(collection(fs, c))), onSnapshot: (next, err) => onSnapshot(collection(fs, c), next, err) })
};

/* ============ Мелкие помощники ============ */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.'));
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const rub = n => fmt(n) + ' ₽';
const usd = n => '$' + (Math.round(n * 100) / 100).toLocaleString('ru-RU');
const money = (a, cur) => cur === 'USD' ? usd(a) : rub(a);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const dmy = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(2, 4) : '';
const byId = (arr, id) => arr.find(x => x.id === id);
const toRub = (a, cur, rate) => cur === 'USD' ? a * rate : a;

/* ============ Состояние ============ */
const TABS = [['sklad','Склад'],['prodano','Проданное'],['rashody','Расходы'],['zadachi','Задачи'],['idei','Идеи']];
const STATUS = {transit:'В пути', stock:'В наличии', reserved:'Бронь'};
const COLS = [['todo','Надо сделать'],['doing','В работе'],['done','Готово']];
const PRIO = {high:['Срочно','bad'], mid:['Обычный','mute'], low:['Низкий','info']};
const S = {
  ready:{}, items:[], sales:[], expenses:[], tasks:[], ideas:[], comments:[], team:[],
  rate:null, me:null, tab:'sklad', dead:false,
  filt:{q:'', status:'', cat:''}, period:'month', from:'', to:'', taskView:'board',
  msg:{conn:'', ro:''}
};
let thread = null;      // открытое обсуждение: 'task:ID' или 'idea:ID'
let pendingPhoto;       // фото, выбранное в форме товара (undefined = не меняли)
let askedWho = false, started = false, installEvt = null;
const nm = id => { const m = byId(S.team, id); return m ? m.name : '—'; };

/* ============ Расчёты (чистые функции) ============ */
// Границы периода в виде строк ГГГГ-ММ-ДД; пустая строка = без границы
function periodRange(p, from, to, now) {
  now = now || new Date();
  if (p === 'month') return [iso(new Date(now.getFullYear(), now.getMonth(), 1)), iso(new Date(now.getFullYear(), now.getMonth() + 1, 0))];
  if (p === 'prev')  return [iso(new Date(now.getFullYear(), now.getMonth() - 1, 1)), iso(new Date(now.getFullYear(), now.getMonth(), 0))];
  if (p === 'custom') return [from || '', to || ''];
  return ['', ''];
}
const inRange = (d, r) => (!r[0] || d >= r[0]) && (!r[1] || d <= r[1]);
// Итоги: оборот, прибыль с продаж, расходы, чистая прибыль, штуки, рентабельность
function stats(sales, expenses, r) {
  let revenue = 0, cogs = 0, count = 0, exp = 0;
  for (const s of sales) if (inRange(s.date, r)) { revenue += s.priceRub * s.qty; cogs += s.costRub * s.qty; count += s.qty; }
  for (const e of expenses) if (inRange(e.date, r)) exp += e.amountRub;
  const gross = revenue - cogs, net = gross - exp;
  return {revenue, cogs, count, exp, gross, net, roi: cogs > 0 ? net / cogs * 100 : null};
}

/* ============ Запись в базу ============ */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 4500); }
async function save(p) {
  try { await p; return true; }
  catch (e) {
    const c = e && e.code;
    toast(c === 'permission-denied' ? 'Не сохранилось: у твоей почты нет доступа. Проверь список почт в правилах Firebase.'
        : c === 'resource-exhausted' ? 'Дневной лимит бесплатной базы исчерпан. Запись заработает завтра.'
        : 'Не сохранилось: нет связи с базой. Попробуй ещё раз.');
    console.error(e);
    return false;
  }
}
const col = c => db.collection(c);

/* ============ Шапка ============ */
function renderTop() {
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab" data-act="tab" data-v="${t[0]}" ${S.tab === t[0] ? 'aria-current="page"' : ''}>${t[1]}</button>`).join('');
  $('#top-right').innerHTML =
    `<button class="chipbtn" data-act="rate" title="Изменить курс">Курс $: <b>${S.rate ? String(S.rate).replace('.', ',') : 'задать'}</b></button>` +
    `<button class="chipbtn" data-act="me" title="Имя и выход">${byId(S.team, S.me) ? esc(nm(S.me)) : 'Профиль'}</button>` +
    '<button class="chipbtn" data-act="theme" title="Сменить тему">тема</button>' +
    (installEvt ? '<button class="chipbtn" data-act="install">Установить</button>' : '');
  const m = [S.msg.conn, S.msg.ro].filter(Boolean);
  $('#banner').innerHTML = m.map(x => `<div>${esc(x)}</div>`).join('');
}

/* ============ Каркасы вкладок (рисуются при переключении) ============ */
function shell() {
  const v = $('#view');
  if (S.tab === 'sklad') v.innerHTML =
    `<div class="tiles" id="sum"></div>
     <div class="bar">
       <input class="in grow" id="f-q" type="search" placeholder="Поиск по названию" value="${esc(S.filt.q)}" aria-label="Поиск">
       <select class="in" id="f-status" aria-label="Статус"><option value="">Все статусы</option>${Object.keys(STATUS).map(k => `<option value="${k}" ${S.filt.status === k ? 'selected' : ''}>${STATUS[k]}</option>`).join('')}</select>
       <select class="in" id="f-cat" aria-label="Категория"></select>
       <button class="btn pri" data-act="item-new">+ Товар</button>
     </div>
     <div class="card scroll" id="list"></div>`;
  if (S.tab === 'prodano') v.innerHTML =
    `<div class="bar">
       <div class="seg">${[['month','Этот месяц'],['prev','Прошлый'],['all','Всё время'],['custom','Свои даты']].map(p => `<button data-act="period" data-v="${p[0]}" aria-pressed="${S.period === p[0]}">${p[1]}</button>`).join('')}</div>
       ${S.period === 'custom' ? `<input class="in" type="date" id="p-from" value="${esc(S.from)}" aria-label="С даты"><input class="in" type="date" id="p-to" value="${esc(S.to)}" aria-label="По дату">` : ''}
     </div>
     <div class="tiles" id="sum"></div>
     <div class="card scroll" id="list"></div>`;
  if (S.tab === 'rashody') v.innerHTML =
    `<div class="tiles" id="sum"></div>
     <div class="bar"><span class="grow"></span><button class="btn pri" data-act="exp-new">+ Расход</button></div>
     <div class="card scroll" id="list"></div>`;
  if (S.tab === 'zadachi') v.innerHTML =
    `<div class="bar">
       <div class="seg"><button data-act="tview" data-v="board" aria-pressed="${S.taskView === 'board'}">Доска</button><button data-act="tview" data-v="mine" aria-pressed="${S.taskView === 'mine'}">Мои задачи</button></div>
       <span class="grow"></span><button class="btn pri" data-act="task-new">+ Задача</button>
     </div><div id="list"></div>`;
  if (S.tab === 'idei') v.innerHTML =
    `<div class="bar"><span class="grow"></span><button class="btn pri" data-act="idea-new">+ Идея</button></div><div id="list"></div>`;
  fill();
}

/* ============ Наполнение (перерисовывается при любом изменении данных) ============ */
const NEED = {sklad:['items'], prodano:['sales','expenses'], rashody:['expenses'], zadachi:['tasks'], idei:['ideas']};
function fill() {
  const list = $('#list'); if (!list) return;
  if (S.dead) { list.innerHTML = '<div class="empty-state">База недоступна.</div>'; return; }
  if (!NEED[S.tab].every(c => S.ready[c])) { list.innerHTML = '<div class="empty-state">Загружаю…</div>'; return; }
  ({sklad:fillSklad, prodano:fillSold, rashody:fillExp, zadachi:fillTasks, idei:fillIdeas})[S.tab]();
}
const tile = (k, v, s, cls) => `<div class="tile ${cls || ''}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const photo = p => (typeof p === 'string' && p.indexOf('data:image/') === 0) ? `<img class="thumb" src="${esc(p)}" alt="">` : '<div class="thumb empty"></div>';
const commentCount = ref => S.comments.filter(c => c.ref === ref).length;

function fillSklad() {
  const all = S.items.filter(i => (i.qty || 0) > 0);
  // Список категорий в фильтре обновляем, только пока он не открыт
  const cats = [...new Set(S.items.map(i => i.cat).filter(Boolean))].sort();
  const fc = $('#f-cat');
  if (document.activeElement !== fc) fc.innerHTML = '<option value="">Все категории</option>' + cats.map(c => `<option ${S.filt.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
  const units = all.reduce((a, i) => a + i.qty, 0), value = all.reduce((a, i) => a + i.costRub * i.qty, 0);
  const cnt = k => all.filter(i => i.status === k).reduce((a, i) => a + i.qty, 0);
  $('#sum').innerHTML = tile('Вещей на складе', fmt(units), '', 'key') + tile('Денег в товаре', rub(value)) +
    tile('В наличии', fmt(cnt('stock'))) + tile('В пути', fmt(cnt('transit'))) + tile('Бронь', fmt(cnt('reserved')));
  const q = S.filt.q.trim().toLowerCase();
  const rows = all.filter(i => (!q || (i.name || '').toLowerCase().includes(q)) && (!S.filt.status || i.status === S.filt.status) && (!S.filt.cat || i.cat === S.filt.cat))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (!rows.length) { $('#list').innerHTML = `<div class="empty-state">${all.length ? 'Ничего не найдено по фильтру.' : 'Склад пуст. Нажми «+ Товар», чтобы внести первую вещь.'}</div>`; return; }
  $('#list').innerHTML = `<table><thead><tr><th></th><th>Товар</th><th>Категория</th><th>Размер</th><th class="num">Кол-во</th><th class="num">Закуп за шт.</th><th>Статус</th><th>Дата</th><th></th></tr></thead><tbody>` +
    rows.map(i => `<tr>
      <td>${photo(i.photo)}</td>
      <td><b>${esc(i.name)}</b>${/^https?:\/\//i.test(i.link || '') ? ` <a class="lnk" href="${esc(i.link)}" target="_blank" rel="noopener">ссылка ↗</a>` : ''}${i.note ? `<div class="sub">${esc(i.note)}</div>` : ''}</td>
      <td>${esc(i.cat || '')}</td><td>${esc(i.size || '')}</td>
      <td class="num">${fmt(i.qty)}</td>
      <td class="num">${money(i.cost, i.cur)}${i.cur === 'USD' ? `<div class="sub">${rub(i.costRub)}</div>` : ''}</td>
      <td><select class="status s-${esc(i.status)}" data-ch="status" data-id="${i.id}" aria-label="Статус">${Object.keys(STATUS).map(k => `<option value="${k}" ${i.status === k ? 'selected' : ''}>${STATUS[k]}</option>`).join('')}</select></td>
      <td>${dmy(i.date)}</td>
      <td class="act"><button class="btn sm pri" data-act="sell" data-id="${i.id}">Продать</button> <button class="btn sm" data-act="item-edit" data-id="${i.id}">Изменить</button> <button class="btn sm danger" data-act="item-del" data-id="${i.id}">Удалить</button></td>
    </tr>`).join('') + '</tbody></table>';
}

function fillSold() {
  const r = periodRange(S.period, S.from, S.to), st = stats(S.sales, S.expenses, r);
  const sign = n => n >= 0 ? 'pos' : 'neg';
  $('#sum').innerHTML = tile('Оборот', rub(st.revenue)) + tile('Прибыль с продаж', `<span class="${sign(st.gross)}">${rub(st.gross)}</span>`, 'продажа минус закуп') +
    tile('Расходы', rub(st.exp), 'упаковка, подарки и прочее') + tile('Чистая прибыль', `<span class="${sign(st.net)}">${rub(st.net)}</span>`, 'после расходов', 'key') +
    tile('Продано штук', fmt(st.count)) + tile('Рентабельность', st.roi == null ? '—' : `<span class="${sign(st.roi)}">${st.roi.toFixed(1).replace('.', ',')}%</span>`, 'чистая прибыль / закуп');
  const rows = S.sales.filter(s => inRange(s.date, r)).sort((a, b) => (b.date + (b.ts || 0)).localeCompare(a.date + (a.ts || 0)));
  if (!rows.length) { $('#list').innerHTML = '<div class="empty-state">За этот период продаж нет. Продажа появится здесь, когда нажмёшь «Продать» на складе.</div>'; return; }
  $('#list').innerHTML = `<table><thead><tr><th>Дата</th><th>Товар</th><th class="num">Кол-во</th><th class="num">Закуп</th><th class="num">Продажа</th><th class="num">Прибыль</th><th class="num">Наценка</th><th>Кто отметил</th><th></th></tr></thead><tbody>` +
    rows.map(s => { const p = (s.priceRub - s.costRub) * s.qty, m = s.costRub > 0 ? (s.priceRub - s.costRub) / s.costRub * 100 : null;
      return `<tr><td>${dmy(s.date)}</td><td><b>${esc(s.name)}</b><div class="sub">${esc([s.cat, s.size].filter(Boolean).join(' · '))}</div></td>
      <td class="num">${fmt(s.qty)}</td><td class="num">${rub(s.costRub * s.qty)}</td>
      <td class="num">${rub(s.priceRub * s.qty)}${s.cur === 'USD' ? `<div class="sub">${usd(s.price * s.qty)}</div>` : ''}</td>
      <td class="num ${sign(p)}">${rub(p)}</td><td class="num">${m == null ? '—' : `<span class="pill ${m >= 0 ? 'good' : 'bad'}">${Math.round(m)}%</span>`}</td>
      <td>${esc(nm(s.by))}</td><td class="act"><button class="btn sm" data-act="return" data-id="${s.id}">Возврат</button></td></tr>`; }).join('') + '</tbody></table>';
}

function fillExp() {
  const all = stats([], S.expenses, ['', '']).exp, mon = stats([], S.expenses, periodRange('month')).exp;
  $('#sum').innerHTML = tile('Расходы за этот месяц', rub(mon), '', 'key') + tile('Расходы за всё время', rub(all));
  const rows = S.expenses.slice().sort((a, b) => (b.date + (b.ts || 0)).localeCompare(a.date + (a.ts || 0)));
  if (!rows.length) { $('#list').innerHTML = '<div class="empty-state">Расходов пока нет. Сюда идут упаковка, подарки, доставка, реклама.</div>'; return; }
  $('#list').innerHTML = `<table><thead><tr><th>Дата</th><th>На что</th><th class="num">Сумма</th><th>Кто внёс</th><th></th></tr></thead><tbody>` +
    rows.map(e => `<tr><td>${dmy(e.date)}</td><td><b>${esc(e.title)}</b></td><td class="num">${money(e.amount, e.cur)}${e.cur === 'USD' ? `<div class="sub">${rub(e.amountRub)}</div>` : ''}</td><td>${esc(nm(e.by))}</td>
      <td class="act"><button class="btn sm" data-act="exp-edit" data-id="${e.id}">Изменить</button> <button class="btn sm danger" data-act="exp-del" data-id="${e.id}">Удалить</button></td></tr>`).join('') + '</tbody></table>';
}

const overdue = t => t.due && t.col !== 'done' && t.due < today();
const taskSort = (a, b) => ({high:0, mid:1, low:2}[a.prio] - {high:0, mid:1, low:2}[b.prio]) || (a.due || '9999').localeCompare(b.due || '9999');
function taskMeta(t) {
  const n = commentCount('task:' + t.id), p = PRIO[t.prio] || PRIO.mid;
  return `<span class="pill ${p[1]}">${p[0]}</span>` + (t.who ? `<span class="pill mute">${esc(nm(t.who))}</span>` : '') +
    (t.due ? `<span class="pill ${overdue(t) ? 'bad' : 'mute'}">до ${dmy(t.due)}</span>` : '') + (n ? `<span>Комментарии: ${n}</span>` : '');
}
function fillTasks() {
  if (S.taskView === 'board') {
    $('#list').innerHTML = '<div class="board">' + COLS.map(c => { const ts = S.tasks.filter(t => (t.col || 'todo') === c[0]).sort(taskSort);
      return `<section class="col" data-col="${c[0]}"><h3><span>${c[1]}</span><span>${ts.length}</span></h3>` +
        (ts.map(t => `<article class="tcard" draggable="true" data-act="task-open" data-id="${t.id}" tabindex="0"><div class="t">${esc(t.title)}</div>
          <div class="prog" title="Выполнено ${t.progress || 0}%"><i style="width:${Math.max(0, Math.min(100, t.progress || 0))}%"></i></div><div class="meta">${taskMeta(t)}</div></article>`).join('') ||
          '<div class="empty-state" style="padding:18px 8px">Пусто</div>') + '</section>'; }).join('') + '</div>';
  } else {
    const ts = S.tasks.filter(t => t.who === S.me).sort((a, b) => ((a.col === 'done') - (b.col === 'done')) || taskSort(a, b));

// Фон-звезда: точки, которые складываются в свечение и лучи из правого верхнего угла. Рисуется один раз и при смене размера окна
function drawStar() {
  const W = window.innerWidth, H = window.innerHeight, a = H / W, step = 11, maxR = 4; let d = '', row = 0;
  for (let y = step / 2; y < H; y += step, row++) for (let x = (row % 2 ? step : step / 2); x < W + step; x += step) {
    const u = Math.min(1, x / W), v = Math.min(1, y / H), dx = u - 0.92, dy = (v - 0.07) * a, dist = Math.sqrt(dx * dx + dy * dy), ang = Math.atan2(dy, dx);
    const glow = Math.max(0, 1 - dist / 0.2), ray = dist > 0.1 ? Math.pow(Math.max(0, Math.sin(ang * 13 + 0.4)), 4) * Math.max(0, 1 - dist / 1.05) : 0;
    const r = maxR * Math.min(1, Math.max(glow, ray * 0.7)); if (!(r >= 0.35)) continue;
    d += 'M' + (x - r).toFixed(1) + ' ' + y.toFixed(1) + 'a' + r.toFixed(1) + ' ' + r.toFixed(1) + ' 0 1 0 ' + (2 * r).toFixed(1) + ' 0a' + r.toFixed(1) + ' ' + r.toFixed(1) + ' 0 1 0 ' + (-2 * r).toFixed(1) + ' 0';
  }
  const svg = $('#stTone'); svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.firstElementChild.setAttribute('d', d);
}
let starTimer; window.addEventListener('resize', () => { clearTimeout(starTimer); starTimer = setTimeout(drawStar, 200); });
drawStar(); applyTheme(document.body.getAttribute('data-theme'));

  install() { if (installEvt) { installEvt.prompt(); installEvt = null; renderTop(); } },
  'item-new'() { itemForm(); }, 'item-edit'(el) { itemForm(el.dataset.id); }, sell(el) { sellForm(el.dataset.id); },
  'item-del'(el) { const i = byId(S.items, el.dataset.id); confirmBox(`Удалить «${i ? i.name : ''}» со склада?`, () => save(db.doc('items/' + el.dataset.id).delete())); },
  'exp-new'() { expForm(); }, 'exp-edit'(el) { expForm(el.dataset.id); },
  'exp-del'(el) { confirmBox('Удалить этот расход?', () => save(db.doc('expenses/' + el.dataset.id).delete())); },
  period(el) { S.period = el.dataset.v; shell(); },
  tview(el) { S.taskView = el.dataset.v; shell(); },
  'task-new'() { taskForm(); }, 'task-open'(el) { taskForm(el.dataset.id); },
  'task-del'(el) { const id = el.dataset.id; confirmBox('Удалить задачу вместе с комментариями?', async () => { if (await save(db.doc('tasks/' + id).delete())) await save(delThread('task:' + id)); }); },
  'idea-new': ideaForm, 'idea-open'(el) { ideaOpen(el.dataset.id); },
  'idea-del'(el) { const id = el.dataset.id; confirmBox('Удалить идею вместе с обсуждением?', async () => { if (await save(db.doc('ideas/' + id).delete())) await save(delThread('idea:' + id)); }); },
  // Голос: повторное нажатие снимает голос. Пишем только своё поле, чужие голоса не затираются
  vote(el) { const i = byId(S.ideas, el.dataset.id); if (!i || !S.me) return; const v = +el.dataset.v, cur = (i.votes || {})[S.me] || 0;
    save(db.doc('ideas/' + i.id).update({votes:{[S.me]: cur === v ? 0 : v}})); },
  // Возврат: штуки возвращаются на склад, продажа удаляется, итоги пересчитываются сами
  return(el) { const s = byId(S.sales, el.dataset.id); if (!s) return;
    confirmBox(`Оформить возврат «${s.name}»? Вещь вернётся на склад.`, async () => {
      const i = byId(S.items, s.itemId);
      const ok = i ? await save(db.doc('items/' + i.id).update({qty:(i.qty || 0) + s.qty, status:'stock'}))
        : await save(db.doc('items/' + s.itemId).set({name:s.name, cat:s.cat, size:s.size, qty:s.qty, cost:s.costRub, cur:'RUB', rate:null, costRub:s.costRub, status:'stock', date:today(), note:'Возврат', by:S.me, ts:Date.now()}));
      if (ok) await save(db.doc('sales/' + s.id).delete());
    }, 'Вернуть'); }
};
document.addEventListener('click', e => {
  if (e.target.id === 'ov') return closeModal();
  if (e.target.closest('input[type=checkbox],select')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  ACT[el.dataset.act](el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#ov').classList.contains('open')) closeModal();
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('tcard')) taskForm(e.target.dataset.id);
});

/* ============ Поля и фильтры ============ */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-q') { S.filt.q = t.value; fill(); }
  if (t.dataset.ch === 'prog') $('#pv').textContent = t.value;
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'f-status') { S.filt.status = t.value; fill(); }
  if (t.id === 'f-cat') { S.filt.cat = t.value; fill(); }
  if (t.id === 'p-from') { S.from = t.value; fill(); }
  if (t.id === 'p-to') { S.to = t.value; fill(); }
  if (t.dataset.ch === 'status') save(db.doc('items/' + t.dataset.id).update({status:t.value}));
  if (t.dataset.ch === 'done') { const k = byId(S.tasks, t.dataset.id); if (k) save(db.doc('tasks/' + k.id).update(t.checked ? {col:'done', progress:100} : {col:'todo', progress:k.progress === 100 ? 0 : (k.progress || 0)})); }
  if (t.dataset.ch === 'cur') { const r = t.form.querySelector('[data-rate]'); if (r) r.hidden = t.value !== 'USD'; }
  if (t.dataset.ch === 'photo' && t.files[0]) {
    try { pendingPhoto = await shrink(t.files[0]); $('#ph').innerHTML = photo(pendingPhoto); }
    catch (err) { toast('Не получилось прочитать фото. Попробуй JPG или PNG.'); }
  }
});
// Фото сжимается до миниатюры 200 px и хранится прямо в записи товара
function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, 200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* ============ Перетаскивание карточек задач ============ */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.tcard'); if (c) { dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} } });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('.col'); if (c && dragId) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('.col'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('.col'); if (!c || !dragId) return;
  e.preventDefault(); c.classList.remove('over');
  const t = byId(S.tasks, dragId), to = c.dataset.col; dragId = null;
  if (t && db && (t.col || 'todo') !== to) save(db.doc('tasks/' + t.id).update(to === 'done' ? {col:to, progress:100} : {col:to}));
});
document.addEventListener('dragend', () => { dragId = null; });

/* ============ Запуск ============ */
function route() {
  if (!S.me) return showLogin();
  const h = location.hash.slice(1);
  S.tab = TABS.some(t => t[0] === h) ? h : 'sklad';
  renderTop(); shell();
}
window.addEventListener('hashchange', route);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.me) renderTop(); });

// Подписки на данные: запускаются один раз после входа
function start() {
  const slow = setTimeout(() => { S.msg.conn = 'База пока не отвечает. Данные появятся сами, как только вернётся связь.'; renderTop(); }, 10000);
  const alive = () => { clearTimeout(slow); if (S.msg.conn) { S.msg.conn = ''; renderTop(); } };
  const onErr = e => { clearTimeout(slow); console.error(e);
    S.msg.conn = e && e.code === 'permission-denied' ? 'Базу не видно: твоей почты нет в списке доступа. Добавь её в правила Firestore в консоли Firebase.'
      : 'Связь с базой прервалась. Обнови страницу.'; renderTop(); };
  for (const c of ['items','sales','expenses','tasks','ideas','comments','team']) {
    col(c).onSnapshot(s => {
      S[c] = s.docs.map(d => Object.assign({id:d.id}, d.data()));
      S.ready[c] = true;
      if (!s.metadata.fromCache) alive();
      if (c === 'team') { S[c].sort((a, b) => (a.ts || 0) - (b.ts || 0)); renderTop();
        // При первом входе спрашиваем имя
        if (!askedWho && !s.metadata.fromCache && !byId(S.team, S.me) && !$('#ov').classList.contains('open')) { askedWho = true; whoForm(); } }
      if (c === 'comments') renderThread();
      fill();
    }, onErr);
  }
  db.doc('meta/settings').onSnapshot(s => { const d = s.exists ? s.data() : null; S.rate = d && d.rate > 0 ? d.rate : null; renderTop(); }, onErr);
}
$('#view').innerHTML = '<div class="empty-state">Загружаю…</div>';
// Firebase сам помнит вход: при повторном открытии пароль не нужен
onAuthStateChanged(auth, u => {
  if (!u) { S.me = null; return showLogin(); }
  S.me = u.uid; S.email = u.email || '';
  route();
  if (!started) { started = true; start(); }
});
</script>
